    <!-- Yandex Games SDK Resilient Loader -->
    <script>
      window.yandexSDKReady = false;
      window.yandexSDKInstance = null;
      window.ysdk = null;
      window.yandexAdError = null;

      async function initYandexSDK() {
        if (window.yandexSDKReady) return;
        console.log("[Yandex SDK] Attempting initialization...");
        try {
          if (typeof YaGames !== 'undefined') {
            const ysdk = await YaGames.init();
            window.ysdk = ysdk;
            window.yandexSDKInstance = ysdk;
            window.yandexSDKReady = true;
            console.log("[Yandex SDK] Initialization successful!");
          } else {
            console.warn("[Yandex SDK] YaGames global variable is undefined during initYandexSDK call.");
          }
        } catch (err) {
          console.error("[Yandex SDK] Initialization error handler:", err);
          window.yandexAdError = err?.message || String(err);
        }
      }

      function getSDKFromQuery() {
        try {
          const params = new URLSearchParams(window.location.search);
          return params.get('sdk');
        } catch (e) {
          console.warn("[Yandex SDK Loader] URLSearchParams is not supported or failed:", e);
          const match = window.location.search.match(/[?&]sdk=([^&]+)/);
          return match ? decodeURIComponent(match[1]) : null;
        }
      }

      function injectSDKScript(src, next) {
        console.log("[Yandex SDK Loader] Dynamic insert: " + src);
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = () => {
          console.log("[Yandex SDK Loader] Load callback triggered for: " + src);
          if (typeof YaGames !== 'undefined') {
            initYandexSDK();
          } else {
            console.warn("[Yandex SDK Loader] Script parsed but YaGames is still undefined for: " + src);
            if (next) next();
          }
        };
        script.onerror = () => {
          console.warn("[Yandex SDK Loader] Failed loading: " + src);
          if (next) next();
        };
        document.head.appendChild(script);
      }

      window.addEventListener('load', () => {
        const sdkParam = getSDKFromQuery();
        const loaders = [];

        // 1. Priorty path from iframe URL passed by Yandex
        if (sdkParam) {
          console.log("[Yandex SDK Loader] Found 'sdk' query parameter:", sdkParam);
          loaders.push(sdkParam);
          if (sdkParam.startsWith('/')) {
            loaders.push("https://yandex.ru" + sdkParam);
            loaders.push("https://yastatic.net" + sdkParam);
          }
        }

        // 2. Standard fallbacks
        loaders.push("/sdk.js"); // Local mock for testing
        loaders.push("https://yastatic.net/games/sdk/v2");
        loaders.push("https://yandex.ru/games/sdk/v2");
        loaders.push("https://sdk.games.yandex.net/sdk/v2");

        let index = 0;
        function tryNext() {
          if (index >= loaders.length) {
            console.log("[Yandex SDK Loader] All SDK resources exhausted. Running offline simulator mode.");
            return;
          }
          const src = loaders[index++];
          injectSDKScript(src, tryNext);
        }

        if (typeof YaGames !== 'undefined') {
          console.log("[Yandex SDK Loader] YaGames is already defined window-level!");
          initYandexSDK();
        } else {
          tryNext();
        }
      });
    </script>
